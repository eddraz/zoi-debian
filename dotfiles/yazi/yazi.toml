# Default Yazi manager for zoi-debian (foot + Sixel).
# Theme colors live in theme.toml (written by zoi-theme).

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
max_width = 1200
max_height = 1800
image_delay = 30
